description: >-
  Check cosmetic ingredient safety across 55+ jurisdiction signals. Roots by Benda checks 30,553 ingredients, 174,973 NOAEL studies, 99,535 pre-calculated Margin of Safety values, 8,898 sensitization assays, and 55+ jurisdiction signals across CPSR, SCCS, INCI, NOAEL, and MoS workflows. The only cosmetic MCP with pre-calculated Margin of Safety using SCCS-style methodology. Ask your AI: 'check if niacinamide is safe for cosmetic use'. Built by one human + Claude. Free. Source-linked.
startCommand:
  type: "http"
  configSchema:
    type: "object"
    properties:
      rootsApiKey:
        type: "string"
        title: "Roots API Key"
        description: "Optional. Supplies a stable user_id for per-user rate limiting; all tools return full data without monetization gates."
        x-from: "header"
        x-to:
          header: "Authorization"
          prefix: "Bearer "
    additionalProperties: false
  exampleConfig:
    rootsApiKey: "mcp_xxxxxxxxxx_xxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxx"
  deploymentUrl: "https://roots-mcp-server.rootsbybenda.workers.dev"
